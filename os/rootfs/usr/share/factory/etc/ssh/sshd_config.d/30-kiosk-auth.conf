# Kiosk SSH auth policy.
#
# Lives in the factory tree (rootfs/usr/share/factory, restored over /etc on
# every boot; see build/configure/enforce.sh), not rootfs/etc, because sshd
# only reads /etc/ssh/sshd_config.d/*.conf — there is no /usr include path, so
# otherwise this would be a security control in a writable, 3-way-merged
# directory where one local edit wins permanently. Numbered 30- to be read
# before 40-redhat-crypto-policies.conf and 50-redhat.conf; sshd takes the
# first value it sees for a keyword.
#
# Passwords stay on: set one at the attached keyboard with `passwd kiosk`, then
# ssh in. Nothing in the image sets or reverts it — it is machine-local state in
# /etc/shadow, and deliberately left that way.
#
# When the RMM agent makes this unnecessary, flip to `no` AND add
# `KbdInteractiveAuthentication no` here. Fedora's 50-redhat.conf already sets
# that today, but it's in writable /etc and not enforced, and
# keyboard-interactive reaches the same password through PAM: one local edit
# there would quietly bring password logins back.
PasswordAuthentication yes
