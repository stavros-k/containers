# Kiosk SSH auth policy.
#
# Lives in the enforce factory tree, not rootfs/etc, because sshd only reads
# /etc/ssh/sshd_config.d/*.conf — there is no /usr include path, so without the
# enforce pass this would be a security control in a writable, 3-way-merged
# directory where one local edit wins permanently. Numbered 30- to be read
# before 40-redhat-crypto-policies.conf and 50-redhat.conf; sshd takes the
# first value it sees for a keyword.
#
# Passwords stay on: set one at the attached keyboard with `passwd kiosk`, then
# ssh in. Nothing in the image sets or reverts it — it is machine-local state in
# /etc/shadow, and deliberately left that way.
#
# When the RMM agent makes this unnecessary, flip to `no` AND add
# `KbdInteractiveAuthentication no` — keyboard-interactive reaches the same
# password through PAM, so turning off only this one changes nothing.
PasswordAuthentication yes
