# Splashtop's self-update downloads a newer .rpm and installs it with dnf via
# `systemd-run --unit=splashtop_streamer_auto_update`. On bootc /usr and /opt
# are read-only, so it can only fail; the streamer is updated by bumping the
# pinned version in programs/splashtop-streamer.sh instead.
#
# It's on by default and can be flipped back from the console or the CLI, so
# force it off on every start rather than once. `auto_update` is the CLI option
# name (it writes AutoUpdateEnable=0 to config/global.conf); the unit's own
# LD_LIBRARY_PATH applies here too. `-` so a failure never blocks remote access.
[Service]
ExecStartPre=-/opt/splashtop-streamer/SRUtility --config --key auto_update --value 0
