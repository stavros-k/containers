# Make the auto-updater wait for /boot to be mounted.
#
# This box has no /etc/fstab, so systemd-gpt-auto-generator owns /boot and makes
# it an *automount* with TimeoutIdleSec=120: after two minutes untouched, /boot
# is unmounted again. bootc opens `boot` under the sysroot without triggering
# the automount (it re-execs under `unshare -m`, and autofs won't service a
# request from that private mount namespace), so on an idle machine the timer
# fired against an unmounted /boot and died with:
#
#   error: Initializing storage: opendir(boot): Operation not permitted
#
# The ostree units already declare this dependency (boot.mount is RequiredBy
# ostree-finalize-staged.service and friends); bootc-fetch-apply-updates.service
# ships with RequiresMountsFor empty, which is the actual gap. Declaring it here
# makes systemd mount /boot before the service starts.
#
# Upstream: https://github.com/bootc-dev/bootc/issues/2402 — still OPEN, keep
# this file and its companion (boot.automount.d/10-no-idle-timeout.conf).
# - bootc-dev/bootc#2411 (first in bootc v1.16.11) re-execs bootc with
#   `unshare --propagation=slave` so the automount reaches it, but the issue was
#   reopened: it doesn't fix the root cause, ostree-system-generator and
#   systemd-gpt-auto-generator both claiming /boot.
# - Fedora 44 still ships bootc 1.16.10 anyway (checked 2026-09-23).
# Drop both files only once #2402 is closed AND the bootc in the image carries
# that fix. Also reported on the issue: with this workaround applied,
# ostree-finalize-staged.service can fail with
# "Remounting /boot read-write: Invalid argument"; check for it if staged
# updates stop landing.
[Unit]
RequiresMountsFor=/boot
