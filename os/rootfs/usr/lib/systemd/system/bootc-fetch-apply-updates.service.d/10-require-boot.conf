# Make the auto-updater wait for /boot to be mounted.
#
# This box has no /etc/fstab, so systemd-gpt-auto-generator owns /boot and makes
# it an *automount* with TimeoutIdleSec=120: after two minutes untouched, /boot
# is unmounted again. bootc opens `boot` under the sysroot without triggering
# the automount (it re-execs under `unshare -m`, and autofs won't service a
# request from that private mount namespace), so on an idle machine the timer
# fired against an unmounted /boot and died with:
#
#   error: Initializing storage: opendir(boot): Operation not permitted
#
# The ostree units already declare this dependency (boot.mount is RequiredBy
# ostree-finalize-staged.service and friends); bootc-fetch-apply-updates.service
# ships with RequiresMountsFor empty, which is the actual gap. Declaring it here
# makes systemd mount /boot before the service starts.
#
# Upstream: https://github.com/bootc-dev/bootc/issues/2402 — closed 2026-11-12,
# but keep this file and its companion (boot.automount.d/10-no-idle-timeout.conf)
# until the image ships the fix. Status (checked 2026-11-17):
# - bootc side: bootc-dev/bootc#2411 (bootc >= 1.16.11) re-execs bootc with
#   `unshare --propagation=slave` so the automount reaches it. Fedora 44 has
#   bootc 1.17.1 stable, so this part is already in the image.
# - ostree side, the fix that closed the issue: ostreedev/ostree#3690 (ostree
#   >= 2026.7) finalizes through the /sysroot/boot fd instead of the /boot
#   path, so finalize survives an idled-out automount. Fedora 44 still has
#   ostree 2026.4 stable; 2026.7 hasn't been submitted to F44 yet.
# - Still open: ostreedev/ostree#3664 masks gpt-auto's boot.automount, which
#   would stop ostree-system-generator and systemd-gpt-auto-generator from both
#   claiming /boot.
# Drop both files once the image has ostree >= 2026.7 (check with
# `rpm -q ostree` in the built image).
# Until then: with this workaround on ostree < 2026.7,
# ostree-finalize-staged.service can fail with
# "Remounting /boot read-write: Invalid argument", and the staged deployment is
# lost at shutdown without any error (bootc-dev/bootc#2622). If staged updates
# stop landing, run `mount -o remount,rw /boot` before upgrading.
[Unit]
RequiresMountsFor=/boot
