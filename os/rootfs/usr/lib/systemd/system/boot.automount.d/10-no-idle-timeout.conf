# Stop /boot from idling out from under bootc.
#
# systemd-gpt-auto-generator sets TimeoutIdleSec=120 on this automount, so /boot
# silently unmounts two minutes after anything last touched it. That's meant for
# removable ESPs; on a fixed kiosk disk it just means a manually-run
# `bootc upgrade` from an idle shell fails with opendir(boot): EPERM, because
# bootc does not trigger the automount itself.
#
# 0 disables the idle logic, so once /boot is mounted it stays mounted, the way
# a normal fstab /boot would. The companion drop-in on
# bootc-fetch-apply-updates.service is what gets it mounted in the first place.
[Automount]
TimeoutIdleSec=0
