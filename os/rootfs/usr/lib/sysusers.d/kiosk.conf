# The one kiosk user, declared for systemd-sysusers rather than created with
# `useradd`. bootc merges /etc across updates, so a locally-modified /etc/passwd
# can shadow the image's copy and the user would stop being redefined by new
# images; a sysusers.d entry is reapplied on every boot instead. configure.sh
# feeds this same file to systemd-sysusers at build time, so the built image
# still ships the passwd/group entries — one source of truth for both.
#
# The shell is spelled out because sysusers defaults to nologin (useradd
# defaulted to bash). systemd-sysusers never creates the home directory; that
# stays the job of tmpfiles.d/kiosk.conf.
u kiosk 1000 "Kiosk user" /var/home/kiosk /bin/bash

# sudo comes from the NOPASSWD rule in /etc/sudoers.d/kiosk, not from wheel;
# this keeps the group membership the old `useradd -G wheel` set up.
m kiosk wheel
