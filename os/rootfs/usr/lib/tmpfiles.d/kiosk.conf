# Just the home root: git can't carry an empty dir, and it must exist early —
# before sshd, so a remote `ssh kiosk@…` doesn't land in a missing home. Dirs
# *inside* the home that carry enforced files get their own `d` lines in the
# kiosk-enforce.conf that configure.sh generates, so this never grows.
d /var/home/kiosk 0700 kiosk kiosk - -
