# Just the home root: the one dir that can't come from the enforce factory tree
# (git can't carry an empty dir) and must exist early — before sshd, so a remote
# `ssh kiosk@…` doesn't land in a missing home. Every dir *inside* the home is
# created by kiosk-enforce-user from the factory tree, so this never grows.
d /var/home/kiosk 0700 kiosk kiosk - -
