# Image-owned config, reasserted over local drift on every boot.
#
# The canonical copies live in the read-only factory tree under
# /usr/share/kiosk/enforce/system, which mirrors absolute paths. Each file is a
# pair of lines, applied by systemd-tmpfiles-setup.service (--create --remove)
# in sysinit, before sshd and the display manager read them. Together they
# always win, on every boot:
#   r  deletes whatever is at the path (the file, edited or not, a symlink, an
#      empty dir). tmpfiles runs every remove before any create, so
#   C  always finds the path empty and copies the factory file there, with the
#      mode set here. (C on its own skips a path that exists, hence the r.)
# The results are ordinary files: a live hotfix (vi, sed -i, chmod) works and
# lasts until the next boot, then the image's version is back. Anything meant
# to outlast a reboot goes through a rollout. Missing parent dirs are created
# root-owned 0755. Running it by hand needs --remove too, or the r lines are
# skipped and nothing is restored:
#   systemd-tmpfiles --create --remove /usr/lib/tmpfiles.d/kiosk-enforce.conf
#
# Mode is set here, not taken from the factory copy: git only carries the exec
# bit. A new file in the factory tree needs a pair here; configure.sh fails the
# build if one is missing.

r /etc/chromium/chromium.conf                     - - - - -
C /etc/chromium/chromium.conf                     0644 root root - /usr/share/kiosk/enforce/system/etc/chromium/chromium.conf

r /etc/containers/registries.conf.d/local.conf    - - - - -
C /etc/containers/registries.conf.d/local.conf    0644 root root - /usr/share/kiosk/enforce/system/etc/containers/registries.conf.d/local.conf

r /etc/sddm.conf.d/kiosk.conf                     - - - - -
C /etc/sddm.conf.d/kiosk.conf                     0644 root root - /usr/share/kiosk/enforce/system/etc/sddm.conf.d/kiosk.conf

r /etc/ssh/sshd_config.d/30-kiosk-auth.conf       - - - - -
C /etc/ssh/sshd_config.d/30-kiosk-auth.conf       0600 root root - /usr/share/kiosk/enforce/system/etc/ssh/sshd_config.d/30-kiosk-auth.conf

# sudo refuses a sudoers file that's group/world-writable; 0440 is the norm
r /etc/sudoers.d/kiosk                            - - - - -
C /etc/sudoers.d/kiosk                            0440 root root - /usr/share/kiosk/enforce/system/etc/sudoers.d/kiosk

r /etc/xdg/autostart/unclutter.desktop            - - - - -
C /etc/xdg/autostart/unclutter.desktop            0644 root root - /usr/share/kiosk/enforce/system/etc/xdg/autostart/unclutter.desktop

r /etc/xdg/kdeglobals                             - - - - -
C /etc/xdg/kdeglobals                             0644 root root - /usr/share/kiosk/enforce/system/etc/xdg/kdeglobals

r /etc/xdg/kscreenlockerrc                        - - - - -
C /etc/xdg/kscreenlockerrc                        0644 root root - /usr/share/kiosk/enforce/system/etc/xdg/kscreenlockerrc

r /etc/xdg/kwalletrc                              - - - - -
C /etc/xdg/kwalletrc                              0644 root root - /usr/share/kiosk/enforce/system/etc/xdg/kwalletrc

r /etc/xdg/powerdevilrc                           - - - - -
C /etc/xdg/powerdevilrc                           0644 root root - /usr/share/kiosk/enforce/system/etc/xdg/powerdevilrc
