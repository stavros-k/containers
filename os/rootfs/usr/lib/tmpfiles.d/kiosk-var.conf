# Package-owned directories under /var, recreated on every boot.
#
# bootc only applies image /var content on first install, never on update, so
# `bootc container lint` wants /var empty in the image. packages.sh deletes
# these (they arrive as empty RPM-owned dirs plus regenerable cache); the
# services that expect them get them back from here each boot, so nothing has
# to depend on what happened to be in /var the day the disk was provisioned.
#
# When the package set changes this list drifts — `bootc container lint` at the
# end of configure.sh names anything new, and stale lines only ever cost an
# empty directory.
d /var/cache/PackageKit 0755 root root - -
d /var/cache/ibus 0755 root root - -
d /var/cache/ibus/bus 0755 root root - -
d /var/cache/libX11 0755 root root - -
d /var/cache/libX11/compose 0755 root root - -
d /var/cache/libdnf5 0755 root root - -
d /var/cache/swcatalog 0755 root root - -
d /var/cache/swcatalog/cache 0755 root root - -
d /var/cache/swcatalog/gv 0755 root root - -
d /var/cache/swcatalog/icons 0755 root root - -
d /var/cache/swcatalog/xml 0755 root root - -
d /var/lib/AccountsService 0775 root root - -
d /var/lib/AccountsService/icons 0775 root root - -
d /var/lib/AccountsService/users 0700 root root - -
d /var/lib/PackageKit 0755 root root - -
d /var/lib/geoclue 0755 geoclue geoclue - -
d /var/lib/tuned 0755 root root - -
d /var/lib/xkb 0755 root root - -
d /var/log/speech-dispatcher 0700 root root - -
d /var/log/tuned 0755 root root - -
