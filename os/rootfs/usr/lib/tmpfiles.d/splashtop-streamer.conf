# Splashtop Streamer's writable state. The RPM keeps it inside
# /opt/splashtop-streamer, read-only on bootc, so programs/splashtop-streamer.sh
# replaces each of these with a symlink to here. Watching a live install, deploy
# and remote session showed only these being written. config/ is written by both
# the root daemons and the user's CLI (`splashtop-streamer deploy`), hence
# group-writable + setgid so new files keep the shared group. dump/ only receives
# crash dumps, kept for Splashtop support.
d /var/lib/splashtop-streamer/config    2775 splashtop-streamer splashtop-streamer - -
d /var/lib/splashtop-streamer/log       2775 splashtop-streamer splashtop-streamer - -
d /var/lib/splashtop-streamer/dump      2775 splashtop-streamer splashtop-streamer - -
d /var/lib/splashtop-streamer/.keyring  0700 root               root               - -

# the static openssl configs the RPM ships under config/, kept in the image
L /var/lib/splashtop-streamer/config/ssl - - - - /opt/splashtop-streamer/ssl
